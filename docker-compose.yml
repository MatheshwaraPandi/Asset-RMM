version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: asset_rmm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asset_rmm_user
      POSTGRES_PASSWORD: change_me_secure
      POSTGRES_DB: asset_rmm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asset_rmm_backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://asset_rmm_user:change_me_secure@postgres:5432/asset_rmm
      SECRET_KEY: a_very_long_random_secret_here
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      OTP_EXPIRE_SECONDS: 600
      NEXTAUTH_URL: https://asset-mgmt.sgtstaging.com
      NEXT_PUBLIC_APP_URL: https://asset-mgmt.sgtstaging.com
      CORS_ORIGINS: https://asset-mgmt.sgtstaging.com
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asset_rmm_frontend
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_API_URL: http://backend:8000
      NEXTAUTH_URL: https://asset-mgmt.sgtstaging.com
      NEXT_PUBLIC_APP_URL: https://asset-mgmt.sgtstaging.com
    ports:
      - "80:3000"

volumes:
  postgres_data:
